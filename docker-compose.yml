services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181
    healthcheck:
      test:
        [
          'CMD',
          'echo',
          'ruok',
          '|',
          'nc',
          'localhost',
          '2181',
          '|',
          'grep',
          'imok',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '9092']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:latest
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smsai
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy

  app:
    build:
      context: . # Use the current directory for the Dockerfile
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment: POSTGRES_HOST=postgres
      POSTGRES_PORT=5432
      POSTGRES_USER=username
      POSTGRES_PASSWORD=password
      POSTGRES_DB=smsai
      KAFKA_BROKER=kafka:9092
      JWT_SECRET=SMSAI_SECRET
      FRONTEND_URL=http://localhost:3002
      PAYTR_MERCHANT_ID=562077
      PAYTR_MERCHANT_KEY=qGMad6R1dKyxC1mu
      PAYTR_MERCHANT_SALT=uEmZENZ3thnCJKg4
    depends_on:
      - postgres
      - kafka
volumes:
  postgres_data:
